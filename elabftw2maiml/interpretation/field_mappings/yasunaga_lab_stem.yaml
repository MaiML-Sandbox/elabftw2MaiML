# YasunagaLab STEM実験の対応表 (development plan Phase 5-4「実際のCustom Field名で
# 対応表を調整する」に対応)。
#
# elabftw2MaiML_phase5_design.md / SEM_TEM_field_mapping_example.md の汎用例
# (`sem_tem_example.yaml`) を、実際にeLabFTW上のMATERIAL/CONDITION/RESULT
# フィールドグループに存在するCustom Field名 (2026-09-16にユーザーから共有された
# スクリーンショット由来) に合わせて調整したもの。
#
# 確認済みの事項 (2026-09-16、ユーザーへの確認結果):
#   - DwellTime / PixelSize は、値の文字列に単位が含まれておらず (例: "10",
#     "0.025")、フィールド名にも単位が無い。ユーザーに確認の上、これらは
#     実際に単位無し (無次元の数値) で正しいことを確認済み。そのため
#     unit は意図的に指定していない (裸の数値としてそのまま反映される。
#     data_type: number により、単位無しでもDecimalとして正規化はされる)。
#   - Grid の値 ("Square Pillar Array,10µm Ptch,Square" 等) は、ドロップダウンの
#     選択肢一覧ではなく、実際にその実験で選択された1件の値そのものである
#     ことを確認済み。文字列フィールドとして扱う (数値+単位の正規化は
#     そもそも文字列フィールドには適用されない)。

version: 1

fields:
  # --- MATERIAL --------------------------------------------------------------
  Grid:
    role: material
    semantic_type: grid_pattern
    data_type: string
    context: experiment
    target: materials

  sampleID:
    role: material
    semantic_type: sample_id
    data_type: string
    context: experiment
    target: materials
    required: true

  sampleName:
    role: material
    semantic_type: sample_name
    data_type: string
    context: experiment
    target: materials
    required: true

  pretreatment:
    role: material
    semantic_type: pretreatment_state
    data_type: string
    context: experiment
    target: materials

  # --- CONDITION ---------------------------------------------------------------
  ImagingMode:
    role: condition
    semantic_type: imaging_mode
    data_type: string
    context: experiment
    target: condition_properties
    required: true

  Aperture(µm):
    role: condition
    semantic_type: objective_aperture
    data_type: number
    unit: µm
    context: experiment
    target: condition_properties

  Magnification:
    role: condition
    semantic_type: magnification
    data_type: number
    unit: x
    context: experiment
    target: condition_properties
    required: true
    # 値の文字列自体には単位が含まれない ("200000")。対応表のunitを補って正規化する。

  CameraLength(mm):
    role: condition
    semantic_type: camera_length
    data_type: number
    unit: mm
    context: experiment
    target: condition_properties

  AcceleratingVoltage(kV):
    role: condition
    semantic_type: accelerating_voltage
    data_type: number
    unit: kV
    context: experiment
    target: condition_properties
    required: true

  ElectronDose(e⁻/Å²):
    role: condition
    semantic_type: electron_dose
    data_type: number
    unit: e⁻/Å²
    context: experiment
    target: condition_properties

  # --- RESULT --------------------------------------------------------------
  # 設計意図の補足 (コードレビュー 2026-09-17 4.4対応。コメントのみ、
  # 分類・target自体は変更していない):
  #
  # レビューでは、PixelSize/ImageWidth/ImageHeight/FieldofView(µm)/
  # AcquisitionTime のように「値そのものは撮影条件 (どう撮ったか) に近く、
  # 実験の結果・成果 (何が得られたか) とは言い切れないのでは」という指摘が
  # あった (例: PixelSizeは装置設定次第で決まる値であり、CameraLength等の
  # CONDITION側フィールドと本質的には近い性質を持つ、という見方)。
  #
  # この対応表では、role/targetを「measurement science上の条件/結果」という
  # 厳密な区分ではなく、実際にYasunagaLabのeLabFTWテンプレート上でその
  # フィールドがどのCustom Field Group (MATERIAL/CONDITION/RESULT) に
  # 属しているかにそのまま合わせる、という方針を採用している。RESULT
  # グループに属するフィールドは、たとえ内容が装置設定寄りに見えても
  # role: result / target: result_properties のままにする。
  #
  # 2026-09-17にユーザーへ確認した結果、現状の分類 (全てresult_properties)
  # を維持する方針で確定した。理由: (1) eLabFTW側のテンプレート構造
  # (どのGroupに入力するか) と、生成されるMaiML上の分類を一致させておく
  # ほうが、実験者にとって「入力した場所」と「出力先」の対応が分かりやすい。
  # (2) STEM観察において「条件」と「結果」の境界は実際には連続的・
  # 文脈依存であり、対応表側で独自の科学的判断を持ち込むと、ラボの実際の
  # 運用 (テンプレートのGroup分け) とMaiML出力がかえって乖離しかねない。
  # 将来、ドメイン的な理由で再分類したくなった場合は、このコメントを
  # 参照した上で対象フィールドのroleとtargetのみを変更すればよい
  # (semantic_type等は変更不要)。
  Detector:
    role: result
    semantic_type: detector_name
    data_type: string
    context: experiment
    target: result_properties

  DwellTime:
    role: result
    semantic_type: dwell_time
    data_type: number
    # 単位無しで正しいことを確認済み (上記注意参照)。unitは意図的に未設定。
    context: experiment
    target: result_properties

  PixelSize:
    role: result
    semantic_type: pixel_size
    data_type: number
    # 単位無しで正しいことを確認済み (上記注意参照)。unitは意図的に未設定。
    context: experiment
    target: result_properties

  FrameCount:
    role: result
    semantic_type: frame_count
    data_type: number
    # 枚数なので単位なし (次元を持たない)。
    context: experiment
    target: result_properties

  SignalType:
    role: result
    semantic_type: signal_type
    data_type: string
    context: experiment
    target: result_properties

  ImageFormat:
    role: result
    semantic_type: image_format
    data_type: string
    context: experiment
    target: result_properties

  AcquisitionTime:
    role: result
    semantic_type: acquisition_time
    data_type: number
    unit: s
    context: experiment
    target: result_properties

  FieldofView(µm):
    role: result
    semantic_type: field_of_view
    data_type: number
    unit: µm
    context: experiment
    target: result_properties

  ImageWidth(pixel):
    role: result
    semantic_type: image_width
    data_type: number
    unit: pixel
    context: experiment
    target: result_properties

  ImageHeight(pixel):
    role: result
    semantic_type: image_height
    data_type: number
    unit: pixel
    context: experiment
    target: result_properties
